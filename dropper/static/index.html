<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Dropper</title>
  <link rel="icon" type="image/svg+xml" href="static/img/logo.svg?v=__ASSET_VERSION__">
  <link rel="preload" href="static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/css/app.css?v=__ASSET_VERSION__">
  <script>
    window.ASSET_V = "__ASSET_VERSION__";
    try { document.documentElement.lang = localStorage.getItem("pr.lang") || "en"; } catch (e) {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="logo" viewBox="0 0 48 48">
        <path d="M24 5.5c6.4 8.6 13.5 15 13.5 23.4a13.5 13.5 0 0 1-27 0c0-8.4 7.1-14.8 13.5-23.4z" fill="currentColor"/>
        <path d="M17.6 30.7a7 7 0 0 0 6.9 6.8" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.8" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="Dropper"><svg class="logo"><use href="#logo"/></svg><span>Dropper</span></a>
      <button class="side-search" data-action="palette">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span data-i18n="palette.hint">Quick actions</span><kbd>Ctrl K</kbd>
      </button>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="side-foot"><div class="account" id="account"></div></div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <a class="brand mobile-only" href="#overview" aria-label="Dropper"><svg class="logo"><use href="#logo"/></svg><span>Dropper</span></a>
        <div class="page-title" id="page-title"><h1></h1><p></p></div>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <div class="mobile-title mobile-only" id="mobile-title"></div>
      <div class="banners" id="banners"></div>
      <main class="view" id="view"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <div id="login-root"></div>
  <div id="overlay-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="static/js/i18n.js?v=__ASSET_VERSION__"></script>
  <script src="static/js/fx.js?v=__ASSET_VERSION__"></script>
  <script src="static/js/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
